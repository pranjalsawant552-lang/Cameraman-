server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Attendance machines (ADMS / "Cloud Server" setting) call /iclock/* on the server
    # address you type into the machine; forward that to the backend.
    location /iclock/ {
        proxy_pass http://backend:8080/api/webhooks/attendance/iclock/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;
    }

    # React Router: any unknown path serves the SPA shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
