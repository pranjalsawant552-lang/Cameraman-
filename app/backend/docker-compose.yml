version: '3.9'

# ============================================================
# Cameraman Photo Studio - Docker Compose
# Full stack: Backend + PostgreSQL + Redis + Nginx
# ============================================================

networks:
  cameraman-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  app_logs:

services:

  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: cameraman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cameraman_db
      POSTGRES_USER: cameraman
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cameraman@2024}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cameraman-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cameraman -d cameraman_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: cameraman-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis@2024} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - cameraman-net
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis@2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Spring Boot Backend
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cameraman-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILE: prod
      DB_URL: jdbc:postgresql://postgres:5432/cameraman_db
      DB_USERNAME: cameraman
      DB_PASSWORD: ${DB_PASSWORD:-cameraman@2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis@2024}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: 900000
      JWT_REFRESH_EXPIRY: 604800000
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      GOOGLE_DRIVE_API_KEY: ${GOOGLE_DRIVE_API_KEY}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
      APP_BASE_URL: ${APP_BASE_URL:-https://cameraman.com}
      SERVER_PORT: 8080
    volumes:
      - app_logs:/app/logs
    ports:
      - "8080:8080"
    networks:
      - cameraman-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: cameraman-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - cameraman-net
