app:
  otp:
    log-to-console: true

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.cameraman: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true

# Storage: defaults to a local MinIO (docker compose), every value overridable via the
# same S3_* env vars used in production — so switching to AWS S3 / iDrive e2 later means
# changing env vars only, no code or yml edits.
storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:cameraman-photos}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin123}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/cameraman-photos}
