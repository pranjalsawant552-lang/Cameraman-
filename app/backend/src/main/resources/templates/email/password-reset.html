<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Reset Password</title>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f6f9;margin:0;padding:0}
.container{max-width:500px;margin:40px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.header{background:linear-gradient(135deg,#1a73e8 0%,#0d47a1 100%);padding:30px;text-align:center}
.header h1{color:#fff;margin:0;font-size:22px}
.body{padding:36px 30px}
.btn{display:inline-block;background:#1a73e8;color:#fff;text-decoration:none;padding:14px 32px;border-radius:8px;font-weight:600;margin:20px 0}
.info{color:#5f6368;font-size:14px;line-height:1.6}
.footer{background:#f8f9fa;padding:18px;text-align:center;color:#9aa0a6;font-size:12px}
</style></head>
<body>
<div class="container">
  <div class="header"><h1 th:text="${appName}">Cameraman Photo Studio</h1></div>
  <div class="body">
    <p class="info">Hi <strong th:text="${name}"></strong>,</p>
    <p class="info">We received a request to reset your password. Click the button below to set a new password. This link is valid for 1 hour.</p>
    <div style="text-align:center"><a class="btn" th:href="${resetUrl}">Reset Password</a></div>
    <p class="info">If you didn't request this, you can safely ignore this email.</p>
  </div>
  <div class="footer" th:text="${appName}">Cameraman Photo Studio</div>
</div>
</body></html>
