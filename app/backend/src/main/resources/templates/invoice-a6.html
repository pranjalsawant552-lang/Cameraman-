<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="'Invoice ' + ${invoice.invoiceNumber}">Invoice</title>
<style>
  @page { size: 105mm 148mm; margin: 0; }
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family: 'Courier New', monospace; font-size: 11px; color: #000; }
.page { width: 302px; padding: 16px; }
.center { text-align: center; }
.studio-name { font-size: 16px; font-weight: bold; }
.divider { border-top: 1px dashed #000; margin: 8px 0; }
table { width: 100%; }
table td { padding: 2px 0; font-size: 10px; }
.right { text-align: right; }
.bold { font-weight: bold; }
.total-row { font-size: 13px; font-weight: bold; border-top: 1px solid #000; padding-top: 4px; }
</style></head>
<body>
<div class="page">
  <div class="center">
    <div class="studio-name" th:text="${studio.studioName}">Cameraman Photo Studio</div>
    <div th:text="${studio.address}"></div>
    <div th:text="${studio.phone}"></div>
    <div th:if="${studio.gstNumber}" th:text="'GSTIN: ' + ${studio.gstNumber}"></div>
  </div>
  <div class="divider"></div>
  <table>
    <tr><td>Invoice#</td><td class="right" th:text="${invoice.invoiceNumber}"></td></tr>
    <tr><td>Date</td><td class="right" th:text="${#temporals.format(invoice.invoiceDate,'dd/MM/yyyy')}"></td></tr>
    <tr><td>Customer</td><td class="right" th:text="${invoice.clientName}"></td></tr>
    <tr th:if="${invoice.clientMobile}"><td>Mobile</td><td class="right" th:text="${invoice.clientMobile}"></td></tr>
  </table>
  <div class="divider"></div>
  <table>
    <tr class="bold"><td>Item</td><td class="right">Qty</td><td class="right">Amt</td></tr>
    <tr th:each="item : ${items}">
      <td th:text="${item.description}"></td>
      <td class="right" th:text="${item.quantity}"></td>
      <td class="right" th:text="${#numbers.formatDecimal(item.lineTotal,1,2)}"></td>
    </tr>
  </table>
  <div class="divider"></div>
  <table>
    <tr><td>Subtotal</td><td class="right" th:text="${#numbers.formatDecimal(invoice.subtotal,1,2)}"></td></tr>
    <tr th:if="${invoice.totalTax > 0}"><td>GST</td><td class="right" th:text="${#numbers.formatDecimal(invoice.totalTax,1,2)}"></td></tr>
    <tr class="total-row"><td>TOTAL</td><td class="right" th:text="'₹' + ${#numbers.formatDecimal(invoice.totalAmount,1,2)}"></td></tr>
  </table>
  <div class="divider"></div>
  <div class="center" style="margin-top:10px">Thank you! Visit again.</div>
  <div th:if="${invoice.generatedByName}" class="center" style="margin-top:4px;font-size:10px;">Billed by: <span th:text="${invoice.generatedByName}"></span></div>
</div>
</body></html>
