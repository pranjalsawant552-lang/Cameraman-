app:
  otp:
    log-to-console: false

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 5

server:
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    accept-count: 100
    connection-timeout: 20000

logging:
  level:
    com.cameraman: INFO
    org.springframework: WARN
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
